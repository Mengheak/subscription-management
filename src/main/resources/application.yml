spring:
  profiles:
    default: dev
  application:
    name: subscription-manager

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: billing-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        query.fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:subscription-manager-usage}
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.chheang.mengheak.subscriptionmanager.messaging.event
        isolation.level: read_committed
    listener:
      ack-mode: record
      concurrency: 3

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.chheang.mengheak.subscriptionmanager: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: subscription-manager
      access-token-ttl: PT30M
      clock-skew: PT30S
      tenant-claim: tid
      roles-claim: roles
    public-paths:
      - /api/v1/auth/**
      - /actuator/health/**
      - /actuator/info
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

  billing:
    default-currency: USD
    money-scale: 2
    usage-scale: 4
    rounding-mode: HALF_UP
    proration-enabled: true
    invoice-due-days: 14
    invoice-number-prefix: INV
    tax-rate: 0.00

  kafka:
    usage-events:
      name: billing.usage-events.v1
      partitions: 6
      replicas: 1
      retention: P7D
    dead-letter-suffix: .DLT
    max-delivery-attempts: 3
    retry-backoff: PT2S
